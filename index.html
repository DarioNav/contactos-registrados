<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ebe5d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rita Guerin">
<title>Rita Guerin · MisContactos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* PALETA */
    --cream: #ebe5d6;
    --cream-soft: #f0ead9;
    --paper: #faf6ec;
    --ink: #15130f;
    --ink-soft: #2a2722;
    --text: #15130f;
    --text-muted: #5a554a;     /* más contraste que antes */
    --text-subtle: #807a6c;
    --rule: rgba(21,19,15,0.16);
    --rule-strong: rgba(21,19,15,0.36);
    --sage: #5b7d6a;
    --sage-deep: #3f5b4d;
    --sage-dim: rgba(91,125,106,0.14);
    --accent: var(--ink);
    --accent2: var(--sage-deep);
    --accent-dim: rgba(21,19,15,0.06);
    --danger: #7a3a44;
    --danger-dim: rgba(122,58,68,0.10);
    --success: var(--sage-deep);
    --radius: 2px;
    --radius-sm: 2px;
    --shadow: 0 1px 0 rgba(21,19,15,0.04), 0 12px 36px rgba(21,19,15,0.06);
    --serif: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--sans);
    background: var(--cream);
    color: var(--text);
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-weight: 400;
    letter-spacing: 0.005em;
  }

  /* ===== HERO ===== */
  .hero {
    position: relative;
    background: var(--cream);
    overflow: hidden;
    border-bottom: 1px solid var(--ink);
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(21,19,15,0.08) 0.9px, transparent 1.4px);
    background-size: 9px 9px;
    pointer-events: none;
    opacity: 0.65;
    mix-blend-mode: multiply;
  }
  .hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 30%, rgba(250,246,236,0.55) 0%, transparent 65%);
    pointer-events: none;
  }

  .hero-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 22px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink);
    position: relative;
    z-index: 3;
  }
  .hero-bar-top { padding-top: 50px; border-bottom: 1px solid var(--rule); }
  .hero-bar-bottom { border-top: 1px solid var(--rule); padding: 14px 22px; justify-content: center; }
  .hero-bar-bottom .dot { color: var(--text-subtle); margin: 0 10px; }

  .hero-content {
    position: relative;
    z-index: 3;
    padding: 40px 24px 32px;
    text-align: center;
  }
  .hero-eyebrow {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 10px;
    color: var(--ink);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .hero-eyebrow::before, .hero-eyebrow::after {
    content: '';
    display: inline-block;
    width: 18px;
    height: 1px;
    background: var(--ink);
    vertical-align: middle;
    margin: 0 12px 3px;
  }
  .hero-title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 56px;
    line-height: 0.95;
    color: var(--ink);
    letter-spacing: -0.015em;
    margin: 0;
  }
  .hero-title em {
    font-style: italic;
    font-weight: 500;
  }
  .hero-subtitle {
    font-family: var(--serif);
    font-style: italic;
    font-size: 16px;
    color: var(--ink-soft);
    font-weight: 500;
    letter-spacing: 0.02em;
    margin-top: 14px;
  }
  .hero-mark {
    width: 14px;
    height: 12px;
    margin: 24px auto 20px;
    display: block;
    color: var(--sage-deep);
  }
  .hero-stats {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
  }
  .hero-stat { text-align: center; }
  .hero-stat-num {
    display: block;
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1;
  }
  .hero-stat-label {
    display: block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 8px;
  }
  .hero-stat-divider {
    width: 1px; height: 28px;
    background: var(--rule-strong);
  }

  /* SVG botanical motif */
  .hero-flora {
    position: absolute;
    top: 80px;
    width: 42px;
    height: 220px;
    color: var(--ink);
    opacity: 0.20;
    pointer-events: none;
    z-index: 2;
  }
  .hero-flora-left { left: 14px; }
  .hero-flora-right { right: 14px; transform: scaleX(-1); }

  /* ===== INSTALL BANNER ===== */
  .install-banner {
    background: var(--ink);
    color: var(--cream);
    padding: 13px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .install-text { flex: 1; }
  .install-close { padding: 4px; cursor: pointer; opacity: 0.7; }

  /* ===== GOOGLE DRIVE SYNC ===== */
  .drive-bar {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 22px;
    background: var(--paper);
    border: none;
    border-bottom: 1px solid var(--rule);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-align: left;
    cursor: pointer;
  }
  .drive-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-subtle);
    flex-shrink: 0;
  }
  .drive-bar[data-state="ok"] .drive-dot { background: var(--sage); }
  .drive-bar[data-state="syncing"] .drive-dot { background: var(--sage); animation: drivePulse 1s ease-in-out infinite; }
  .drive-bar[data-state="error"] .drive-dot,
  .drive-bar[data-state="reconnect"] .drive-dot { background: var(--danger); }
  .drive-bar[data-state="off"] { background: var(--ink); color: var(--cream); border-bottom-color: var(--ink); }
  .drive-bar[data-state="off"] .drive-dot { background: var(--cream); }
  .drive-text { flex: 1; }
  .drive-sub { font-weight: 400; letter-spacing: 0.04em; text-transform: none; opacity: 0.7; font-size: 11px; }
  @keyframes drivePulse { 50% { opacity: 0.25; } }

  /* ===== SEARCH (destacado, sticky) ===== */
  .search-wrap {
    padding: 18px 22px 14px;
    background: var(--cream);
    position: sticky;
    top: 0;
    z-index: 40;
    border-bottom: 1px solid var(--rule);
  }
  .search-label {
    display: block;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.22em;
    margin-bottom: 8px;
  }
  .search-box {
    display: flex;
    align-items: center;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    padding: 0 14px;
    gap: 12px;
    transition: box-shadow 0.2s;
    box-shadow: 0 4px 14px rgba(21,19,15,0.10);
  }
  .search-box:focus-within {
    box-shadow: 0 6px 20px rgba(21,19,15,0.18);
  }
  .search-icon {
    font-size: 20px;
    color: var(--ink);
    line-height: 1;
    font-weight: 600;
  }
  .search-box input {
    flex: 1;
    background: none;
    border: none;
    color: var(--ink);
    font-size: 16px;
    padding: 14px 0;
    outline: none;
    font-family: var(--sans);
    font-weight: 500;
    letter-spacing: 0.01em;
    min-width: 0;
  }
  .search-box input::placeholder {
    color: var(--text-muted);
    opacity: 0.9;
    font-style: italic;
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 500;
  }
  .search-clear {
    display: none;
    background: var(--ink);
    border: none;
    color: var(--cream);
    font-size: 11px;
    cursor: pointer;
    width: 22px;
    height: 22px;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .search-clear.visible { display: flex; }

  /* ===== TAG FILTERS ===== */
  .tags-scroll {
    display: flex;
    gap: 0;
    padding: 18px 22px 14px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    border-bottom: 1px solid var(--rule);
  }
  .tags-scroll::-webkit-scrollbar { display: none; }
  .tag-chip {
    flex-shrink: 0;
    padding: 4px 0 6px;
    margin-right: 22px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    background: none;
    color: var(--text-muted);
    cursor: pointer;
    transition: color 0.2s;
    border: none;
    border-bottom: 1px solid transparent;
    user-select: none;
    font-family: var(--sans);
    white-space: nowrap;
  }
  .tag-chip:last-child { margin-right: 0; }
  .tag-chip.active {
    color: var(--ink);
    border-bottom-color: var(--ink);
  }

  /* ===== CONTACTS LIST ===== */
  .contacts-list {
    padding: 0 22px 60px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .contact-card {
    background: transparent;
    padding: 20px 0;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    cursor: pointer;
    transition: opacity 0.15s;
    position: relative;
    border-bottom: 1px solid var(--rule);
  }
  .contact-card:active { opacity: 0.55; }
  .contact-card:last-child { border-bottom: none; }
  .contact-avatar {
    width: 60px; height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--cream);
    flex-shrink: 0;
    text-transform: uppercase;
    font-family: var(--serif);
    letter-spacing: 0.04em;
    border: 1px solid var(--rule-strong);
  }
  .contact-info { flex: 1; min-width: 0; padding-top: 4px; }
  .contact-name {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 21px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.15;
  }
  .contact-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 0;
    margin-top: 9px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    border: 1px solid currentColor;
    background: transparent !important;
    font-family: var(--sans);
  }
  .rasgos-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .rasgo-chip {
    display: inline-block;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    color: var(--ink);
    background: var(--cream-soft);
    padding: 4px 10px;
    border-radius: 0;
    border: 1px solid var(--rule-strong);
    letter-spacing: 0.04em;
    line-height: 1.3;
  }
  .rasgo-chip::before {
    content: '#';
    color: var(--text-muted);
    margin-right: 2px;
  }

  /* AVATAR WITH PHOTO */
  .contact-avatar.has-photo, .detail-avatar.has-photo, .photo-preview.has-photo {
    background-size: cover;
    background-position: center;
    color: transparent;
  }

  /* ===== EMPTY STATE ===== */
  .empty-state {
    text-align: center;
    padding: 90px 24px;
    color: var(--text-muted);
  }
  .empty-icon {
    font-size: 22px;
    margin-bottom: 18px;
    font-family: var(--serif);
    letter-spacing: 0.4em;
    color: var(--text-subtle);
  }
  .empty-title {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 8px;
    font-style: italic;
  }
  .empty-sub {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-family: var(--sans);
    font-weight: 500;
    color: var(--text-muted);
  }

  /* ===== CTA HERO (botón principal en el hero) ===== */
  .hero-cta {
    display: flex;
    width: 100%;
    background: var(--ink);
    color: var(--cream);
    border: none;
    padding: 18px 22px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: opacity 0.15s;
    position: relative;
    z-index: 3;
  }
  .hero-cta:active { opacity: 0.78; }
  .hero-cta span { font-size: 16px; font-weight: 400; line-height: 1; }

  /* CTA STICKY (aparece al scrollear) */
  .cta-sticky {
    width: 100%;
    background: var(--ink);
    color: var(--cream);
    border: none;
    padding: 13px 16px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 14px;
    transition: opacity 0.15s;
  }
  .cta-sticky.visible { display: flex; animation: slideDown 0.25s ease both; }
  .cta-sticky:active { opacity: 0.78; }
  .cta-sticky span { font-size: 14px; font-weight: 400; line-height: 1; }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== OVERLAY / SHEET ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(21,19,15,0.45);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .overlay.open { display: flex; justify-content: center; align-items: flex-end; }
  .overlay.visible { opacity: 1; }
  .sheet {
    background: var(--paper);
    border-radius: 0;
    width: 100%;
    max-width: 480px;
    max-height: 92dvh;
    overflow-y: auto;
    padding: 14px 26px 40px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
    border-top: 1px solid var(--ink);
  }
  .overlay.visible .sheet { transform: translateY(0); }
  .sheet-handle {
    width: 32px; height: 2px;
    background: var(--rule-strong);
    margin: 0 auto 22px;
  }
  .sheet-title {
    font-family: var(--serif);
    font-style: italic;
    font-size: 28px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
    text-align: center;
    letter-spacing: -0.005em;
  }
  .sheet-title-rule {
    width: 36px;
    height: 1px;
    background: var(--ink);
    margin: 14px auto 24px;
  }

  /* ===== FORM ===== */
  .form-group { margin-bottom: 22px; }
  .form-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    margin-bottom: 10px;
    font-family: var(--sans);
  }
  .form-hint {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
    font-style: italic;
    font-family: var(--serif);
    font-weight: 500;
  }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule-strong);
    border-radius: 0;
    color: var(--ink);
    font-size: 17px;
    padding: 6px 0 10px;
    font-family: var(--serif);
    outline: none;
    transition: border-color 0.2s;
    font-weight: 500;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-bottom-color: var(--ink);
  }
  .form-select {
    appearance: none;
    cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%2315130f' stroke-width='1.2' fill='none' stroke-linecap='square'/></svg>");
    background-repeat: no-repeat;
    background-position: right 4px center;
    padding-right: 24px;
  }
  .form-textarea { resize: vertical; min-height: 60px; padding: 6px 0 10px; line-height: 1.5; }
  .form-input::placeholder, .form-textarea::placeholder {
    color: var(--text-muted);
    opacity: 0.65;
    font-style: italic;
  }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 32px;
  }
  .btn {
    flex: 1;
    padding: 15px;
    border-radius: 0;
    font-size: 11px;
    font-weight: 600;
    font-family: var(--sans);
    text-transform: uppercase;
    letter-spacing: 0.22em;
    border: 1px solid var(--ink);
    cursor: pointer;
    transition: opacity 0.15s;
    background: transparent;
    color: var(--ink);
  }
  .btn:active { opacity: 0.65; }
  .btn-primary { background: var(--ink); color: var(--cream); }
  .btn-secondary { background: transparent; color: var(--ink); }
  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    font-size: 11px;
    padding: 13px;
    letter-spacing: 0.2em;
  }

  /* ===== DETAIL ===== */
  .detail-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 28px;
    padding-top: 8px;
  }
  .detail-avatar {
    width: 124px; height: 124px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 600;
    font-family: var(--serif);
    color: var(--cream);
    background: var(--ink);
    margin-bottom: 18px;
    text-transform: uppercase;
    border: 1px solid var(--rule-strong);
    letter-spacing: 0.04em;
  }
  .detail-name {
    font-family: var(--serif);
    font-style: italic;
    font-size: 32px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.1;
  }
  .detail-section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin: 30px 0 14px;
    text-align: center;
    font-family: var(--sans);
  }
  .detail-section-label::before, .detail-section-label::after {
    content: '';
    display: inline-block;
    width: 18px;
    height: 1px;
    background: var(--rule-strong);
    vertical-align: middle;
    margin: 0 14px;
  }
  .detail-rasgos {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    padding: 4px 0 8px;
  }
  .detail-rasgos .rasgo-chip {
    font-size: 12px;
    padding: 6px 12px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .detail-rasgos .rasgo-chip:active { background: var(--cream); border-color: var(--ink); }
  .detail-actions {
    display: flex;
    gap: 10px;
    margin-top: 32px;
  }

  /* ===== PHOTO PICKER ===== */
  .photo-picker {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 4px 0 26px;
    gap: 12px;
  }
  .photo-preview {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: var(--cream-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--text-muted);
    cursor: pointer;
    overflow: hidden;
    background-size: cover;
    background-position: center;
    border: 1px solid var(--rule-strong);
    transition: border-color 0.2s, transform 0.15s;
  }
  .photo-preview.has-photo { border-color: var(--ink); }
  .photo-preview:active { transform: scale(0.97); }
  .photo-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .photo-btn {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 0;
    padding: 9px 16px;
    font-size: 10px;
    font-weight: 600;

  /* ===== RASGOS INPUT (chips builder) ===== */
  .rasgos-input-wrap {

</style>
</head>

<script>
// ===== CONFIG =====
const AVATAR_COLORS = ['#15130f','#2c2722','#3f5870','#3f5b4d','#7a3a44','#3a4a3a','#8a4a5b','#3d342a'];
const STORAGE_KEY = 'miscontactos_data';
const DELETED_KEY = 'miscontactos_deleted';

// Google Drive: pegar acá el "ID de cliente" de OAuth creado en Google Cloud.
const GOOGLE_CLIENT_ID = '147888333021-9efrtt5r0usthegs58fd1idtkkb82r36.apps.googleusercontent.com';
const DRIVE_FOLDER_NAME = 'Mis contactos';
const DRIVE_FILE_NAME = 'miscontactos_datos.json';

// ===== STATE =====
let contacts = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let searchQuery = '';
let formPhoto = '';
let formRasgos = [];

// ===== HELPERS =====
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function initials(name) {
  const parts = name.trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  return name.slice(0, 2).toUpperCase();
}
function avatarColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(contacts));
  Drive.markDirty();
}

// Registra un borrado para que no "reviva" al sincronizar con otro dispositivo.
function markDeleted(id) {
  const deleted = JSON.parse(localStorage.getItem(DELETED_KEY) || '{}');
  deleted[id] = new Date().toISOString();
  localStorage.setItem(DELETED_KEY, JSON.stringify(deleted));
}

// Parsea string de rasgos a array limpio.
function parseRasgos(str) {
  if (!str) return [];
  return str.split(/[,;.\n]+/)
    .map(s => s.trim())
    .filter(Boolean);
}

// ===== RASGOS BUILDER (form) =====
function renderRasgosForm() {
  const wrap = document.getElementById('fRasgosWrap');
  const input = document.getElementById('fRasgosInput');
  if (!wrap || !input) return;
  wrap.querySelectorAll('.rasgo-edit-chip').forEach(el => el.remove());
  formRasgos.forEach((r, idx) => {
    const chip = document.createElement('span');
    chip.className = 'rasgo-edit-chip';
    const rm = document.createElement('span');
    rm.className = 'rm';
    rm.textContent = '✕';
    rm.addEventListener('click', e => {
      e.stopPropagation();
      formRasgos.splice(idx, 1);
      renderRasgosForm();
    });
    chip.appendChild(document.createTextNode(r));
    chip.appendChild(rm);
    wrap.insertBefore(chip, input);
  });
  input.placeholder = formRasgos.length ? 'sumar otro rasgo y poner punto…' : 'ej: modelo. morocha. muy divertida.';
}

function commitRasgoBuffer() {
  const input = document.getElementById('fRasgosInput');
  const v = input.value.trim().replace(/\.+$/, '').trim();
  if (v) formRasgos.push(v);
  input.value = '';
  renderRasgosForm();
}

// ===== FOTO =====
function resizeImage(file, maxSize = 480, quality = 0.78) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxSize) { height = height * (maxSize / width); width = maxSize; }
        else if (height > maxSize) { width = width * (maxSize / height); height = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function setPhotoPreview(dataUrl) {
  formPhoto = dataUrl || '';
  const preview = document.getElementById('photoPreview');
  const placeholder = document.getElementById('photoPlaceholder');
  const removeBtn = document.getElementById('photoRemoveBtn');
  if (formPhoto) {
    preview.style.backgroundImage = `url(${formPhoto})`;
    preview.classList.add('has-photo');
    placeholder.style.display = 'none';
    removeBtn.style.display = 'inline-block';
  } else {
    preview.style.backgroundImage = '';
    preview.classList.remove('has-photo');
    placeholder.style.display = 'block';
    removeBtn.style.display = 'none';
  }
}
function clearPhoto() { setPhotoPreview(''); }

// ===== RENDER CONTACTS =====
function renderContacts() {
  const list = document.getElementById('contactsList');
  let filtered = contacts;

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(c => {
      const rasgos = (c.rasgos || '').toLowerCase();
      return (c.nombre || '').toLowerCase().includes(q) ||
             rasgos.includes(q) ||
             (c.conocidoComo || '').toLowerCase().includes(q);
    });
  }

  filtered.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));

  document.getElementById('totalCount').textContent = String(contacts.length).padStart(2, '0');
  const allRasgos = new Set();
  contacts.forEach(c => parseRasgos(c.rasgos).forEach(r => allRasgos.add(r.toLowerCase())));
  document.getElementById('tagsCount').textContent = String(allRasgos.size).padStart(2, '0');

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${searchQuery ? '⌕' : '◆ ◆ ◆'}</div>
        <div class="empty-title">${searchQuery ? 'sin resultados' : 'agenda en blanco'}</div>
        <div class="empty-sub">${searchQuery ? 'Probá con otra palabra' : 'Sumá tu primer contacto'}</div>
      </div>`;
    return;
  }

  list.innerHTML = filtered.map((c, i) => {
    const color = avatarColor(c.nombre);
    const avatarStyle = c.foto
      ? `background-image:url(${c.foto})`
      : `background:${color}`;
    const avatarClass = c.foto ? 'contact-avatar has-photo' : 'contact-avatar';
    const avatarText = c.foto ? '' : initials(c.nombre);
    const rasgosArr = parseRasgos(c.rasgos).slice(0, 4);
    const rasgosHTML = rasgosArr.length
      ? `<div class="rasgos-chips">${rasgosArr.map(r => `<span class="rasgo-chip">${r}</span>`).join('')}</div>`
      : '';
    return `
      <div class="contact-card" data-id="${c.id}" style="animation-delay:${i * 0.04}s" onclick="showDetail('${c.id}')">
        <div class="${avatarClass}" style="${avatarStyle}">${avatarText}</div>
        <div class="contact-info">
          <div class="contact-name">${c.nombre}</div>
          ${rasgosHTML}
        </div>
      </div>`;
  }).join('');
}

// ===== FORM: OPEN / CLOSE =====
function openOverlay(id) {
  const el = document.getElementById(id);
  el.classList.add('open');
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
}
function closeOverlay(id) {
  const el = document.getElementById(id);
  el.classList.remove('visible');
  setTimeout(() => el.classList.remove('open'), 300);
}

function openForm(contact) {
  document.getElementById('formTitle').textContent = contact ? 'Editar contacto' : 'Nuevo contacto';
  document.getElementById('editId').value = contact ? contact.id : '';
  document.getElementById('fNombre').value = contact ? contact.nombre : '';
  formRasgos = contact ? parseRasgos(contact.rasgos) : [];
  document.getElementById('fRasgosInput').value = '';
  renderRasgosForm();
  document.getElementById('fConocidoComo').value = contact ? contact.conocidoComo || '' : '';
  setPhotoPreview(contact ? contact.foto || '' : '');
  document.getElementById('deleteBtn').style.display = contact ? 'block' : 'none';
  openOverlay('formOverlay');
}

// ===== FORM: SAVE =====
document.getElementById('saveBtn').addEventListener('click', () => {
  const nombre = document.getElementById('fNombre').value.trim();
  if (!nombre) { document.getElementById('fNombre').style.borderBottomColor = 'var(--danger)'; return; }

  // Si hay texto pendiente en el input de rasgos sin punto, lo guardamos igual.
  const pendingRasgo = document.getElementById('fRasgosInput').value.trim().replace(/\.+$/, '').trim();
  if (pendingRasgo) { formRasgos.push(pendingRasgo); document.getElementById('fRasgosInput').value = ''; }

  const id = document.getElementById('editId').value;
  const finalId = id || genId();
  const data = {
    id: finalId,
    nombre,
    rasgos: formRasgos.join(', '),
    foto: formPhoto || '',
    conocidoComo: document.getElementById('fConocidoComo').value.trim(),
    creado: id ? (contacts.find(c => c.id === id)?.creado || new Date().toISOString()) : new Date().toISOString(),
    modificado: new Date().toISOString()
  };

  if (id) {
    const idx = contacts.findIndex(c => c.id === id);
    if (idx >= 0) contacts[idx] = data;
  } else {
    contacts.push(data);
  }

  try {
    save();
  } catch (err) {
    alert('No se pudo guardar (almacenamiento lleno). Probá con una foto más chica o eliminá contactos.');
    return;
  }
  closeOverlay('formOverlay');
  renderContacts();
});

// ===== FORM: DELETE =====
document.getElementById('deleteBtn').addEventListener('click', () => {
  const id = document.getElementById('editId').value;
  if (id && confirm('¿Eliminar este contacto?')) {
    contacts = contacts.filter(c => c.id !== id);
    markDeleted(id);
    save();
    closeOverlay('formOverlay');
    closeOverlay('detailOverlay');
    renderContacts();
  }
});

// ===== DETAIL VIEW =====
function showDetail(id) {
  const c = contacts.find(x => x.id === id);
  if (!c) return;
  const color = avatarColor(c.nombre);

  const rasgosArr = parseRasgos(c.rasgos);
  const rasgosBlock = rasgosArr.length
    ? `<div class="detail-section-label">Rasgos salientes</div>
       <div class="detail-rasgos">${rasgosArr.map(r => `<span class="rasgo-chip" data-rasgo="${r.replace(/"/g,'&quot;')}">${r}</span>`).join('')}</div>`
    : '';

  const conocidoBlock = c.conocidoComo
    ? `<div class="detail-section-label">Cómo la conocí</div>
       <div style="font-family:var(--serif); font-style:italic; font-size:17px; line-height:1.5; color:var(--ink); text-align:center; padding: 0 8px;">« ${c.conocidoComo} »</div>`
    : '';

  const avatarStyle = c.foto ? `background-image:url(${c.foto})` : `background:${color}`;
  const avatarClass = c.foto ? 'detail-avatar has-photo' : 'detail-avatar';
  const avatarText = c.foto ? '' : initials(c.nombre);

  document.getElementById('detailContent').innerHTML = `
    <div class="detail-header">
      <div class="${avatarClass}" style="${avatarStyle}">${avatarText}</div>
      <div class="detail-name">${c.nombre}</div>
    </div>
    ${rasgosBlock}
    ${conocidoBlock}
    <div class="detail-actions">
      <button class="btn btn-secondary" onclick="closeOverlay('detailOverlay')">Cerrar</button>
      <button class="btn btn-primary" onclick="closeOverlay('detailOverlay');openForm(contacts.find(c=>c.id==='${c.id}'))">Editar</button>
    </div>
  `;

  // Hacer chips de rasgos clickeables: setean el buscador
  document.querySelectorAll('.detail-rasgos .rasgo-chip').forEach(el => {
    el.addEventListener('click', () => {
      const r = el.dataset.rasgo || el.textContent;
      document.getElementById('searchInput').value = r;
      searchQuery = r;
      document.getElementById('searchClear').classList.add('visible');
      closeOverlay('detailOverlay');
      renderContacts();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  openOverlay('detailOverlay');
}

// ===== SEARCH =====
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value.trim();
  searchClear.classList.toggle('visible', searchQuery.length > 0);
  renderContacts();
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchQuery = '';
  searchClear.classList.remove('visible');
  renderContacts();
});

// ===== BUTTONS =====
document.getElementById('addBtnHero').addEventListener('click', () => openForm(null));
document.getElementById('addBtnSticky').addEventListener('click', () => openForm(null));
document.getElementById('cancelBtn').addEventListener('click', () => closeOverlay('formOverlay'));

// El sticky aparece sólo cuando el botón del hero queda fuera de la vista.
(function () {
  const heroBtn = document.getElementById('addBtnHero');
  const stickyBtn = document.getElementById('addBtnSticky');
  if (!heroBtn || !stickyBtn || !('IntersectionObserver' in window)) return;
  const obs = new IntersectionObserver(([entry]) => {
    stickyBtn.classList.toggle('visible', !entry.isIntersecting);
  }, { threshold: 0, rootMargin: '0px' });
  obs.observe(heroBtn);
})();

// ===== FOTO INPUT =====
document.getElementById('photoInput').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    const dataUrl = await resizeImage(file);
    setPhotoPreview(dataUrl);
  } catch {
    alert('No se pudo procesar la imagen.');
  }
  e.target.value = '';
});

// ===== RASGOS: input listeners =====
(function () {
  const input = document.getElementById('fRasgosInput');
  if (!input) return;
  input.addEventListener('input', () => {
    if (input.value.includes('.')) {
      // Cada parte separada por punto se vuelve chip; el resto queda en el input.
      const parts = input.value.split('.');
      const last = parts.pop();
      parts.forEach(p => { const t = p.trim(); if (t) formRasgos.push(t); });
      input.value = last;
      renderRasgosForm();
      input.focus();
    }
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      commitRasgoBuffer();
    } else if (e.key === 'Backspace' && !input.value && formRasgos.length) {
      formRasgos.pop();
      renderRasgosForm();
    }
  });
  input.addEventListener('blur', () => {
    // Al salir del campo, lo pendiente queda como chip si hay contenido.
    if (input.value.trim()) commitRasgoBuffer();
  });
})();

// Close overlays on backdrop click
['formOverlay', 'detailOverlay'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    if (e.target.classList.contains('overlay')) closeOverlay(id);
  });
});

// ===== PWA INSTALL =====
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').style.display = 'flex';
});
document.getElementById('installBanner').addEventListener('click', () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
  }
  document.getElementById('installBanner').style.display = 'none';
});
document.getElementById('installClose').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('installBanner').style.display = 'none';
});

// ===== EXPORT / IMPORT (backup) =====
function exportContacts() {
  const blob = new Blob([JSON.stringify(contacts, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'miscontactos_backup_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}
function importContacts(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data)) {
        const keep = new Set(data.map(c => c.id));
        contacts.filter(c => !keep.has(c.id)).forEach(c => markDeleted(c.id));
        contacts = data.map(c => ({ ...c, modificado: new Date().toISOString() }));
        save();
        renderContacts();
        alert('Importados ' + data.length + ' contactos');
      }
    } catch { alert('Archivo inválido'); }
  };
  reader.readAsText(file);
}

// ===== GOOGLE DRIVE SYNC =====
// Los datos viven en un archivo JSON dentro de la carpeta "Mis contactos" del Drive
// de la cuenta conectada. localStorage queda como copia local para usar sin conexión.
const Drive = (() => {
  const SCOPE = 'https://www.googleapis.com/auth/drive.file';
  const API = 'https://www.googleapis.com/drive/v3';
  const UPLOAD = 'https://www.googleapis.com/upload/drive/v3';
  const STATE_KEY = 'miscontactos_drive';   // { email, fileId, lastSync }
  const TOKEN_KEY = 'miscontactos_token';   // { token, exp }
  const DIRTY_KEY = 'miscontactos_dirty';   // marca de cambios sin subir

  let state = readJSON(STATE_KEY, null);
  let syncing = false, again = false, timer = null;

  function readJSON(k, fallback) {
    try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch { return fallback; }
  }
  function writeJSON(k, v) {
    if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v));
  }
  function authError() { return Object.assign(new Error('auth'), { auth: true }); }
  const stamp = c => c.modificado || c.creado || '';

  function validToken() {
    const t = readJSON(TOKEN_KEY, null);
    return t && t.exp > Date.now() + 60000 ? t.token : null;
  }

  // Abre la ventana de Google: tiene que llamarse directo desde un toque del usuario.
  function requestToken() {
    return new Promise((resolve, reject) => {
      if (!window.google?.accounts?.oauth2) {
        return reject(new Error('Google todavía no cargó. Probá de nuevo en unos segundos.'));
      }
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: SCOPE,
        callback: resp => {
          if (resp.error) return reject(new Error(resp.error));
          writeJSON(TOKEN_KEY, { token: resp.access_token, exp: Date.now() + resp.expires_in * 1000 });
          resolve(resp.access_token);
        },
        error_callback: err => reject(Object.assign(new Error(err.type || 'popup'), { popup: err.type })),
      });
      client.requestAccessToken({ prompt: state ? '' : 'consent', login_hint: state?.email || '' });
    });
  }

  async function api(path, opts = {}, base = API) {
    const token = validToken();
    if (!token) throw authError();
    const res = await fetch(base + path, {
      ...opts,
      headers: { Authorization: 'Bearer ' + token, ...(opts.headers || {}) },
    });
    if (res.status === 401) { writeJSON(TOKEN_KEY, null); throw authError(); }
    if (!res.ok) throw new Error('Drive ' + res.status);
    return res;
  }
  async function findOne(q) {
    const res = await api('/files?spaces=drive&fields=files(id)&q=' + encodeURIComponent(q + ' and trashed=false'));
    return (await res.json()).files[0]?.id || null;
  }
  async function create(meta) {
    const res = await api('/files?fields=id', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(meta),
    });
    return (await res.json()).id;
  }

  // Devuelve el id del archivo de datos, creando carpeta y archivo si no existen.
  async function ensureFile() {
    if (state.fileId) {
      try {
        const f = await (await api(`/files/${state.fileId}?fields=id,trashed`)).json();
        if (!f.trashed) return state.fileId;
      } catch (e) { if (e.auth) throw e; }
    }
    const folderQ = `name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder'`;
    const folderId = await findOne(folderQ)
      || await create({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' });
    const fileId = await findOne(`name='${DRIVE_FILE_NAME}' and '${folderId}' in parents`)
      || await create({ name: DRIVE_FILE_NAME, parents: [folderId], mimeType: 'application/json' });
    setState({ fileId });
    return fileId;
  }

  async function download(fileId) {
    const text = await (await api(`/files/${fileId}?alt=media`)).text();
    if (!text.trim()) return { contacts: [], deleted: {} };
    const d = JSON.parse(text);
    if (Array.isArray(d)) return { contacts: d, deleted: {} };
    return { contacts: d.contacts || [], deleted: d.deleted || {} };
  }
  async function upload(fileId, data) {
    await api(`/files/${fileId}?uploadType=media`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ app: 'MisContactos', version: 1, actualizado: new Date().toISOString(), ...data }),
    }, UPLOAD);
  }

  // Une lo local con lo de Drive: por cada contacto gana la versión modificada más
  // recientemente, y un borrado gana si es posterior a la última edición.
  function merge(local, remote) {
    const deleted = { ...remote.deleted };
    for (const [id, at] of Object.entries(local.deleted)) {
      if (!deleted[id] || at > deleted[id]) deleted[id] = at;
    }
    const byId = new Map();
    for (const c of [...remote.contacts, ...local.contacts]) {
      const prev = byId.get(c.id);
      if (!prev || stamp(c) > stamp(prev)) byId.set(c.id, c);
    }
    const merged = [...byId.values()].filter(c => !deleted[c.id] || stamp(c) > deleted[c.id]);
    return { contacts: merged, deleted };
  }
  const signature = d => JSON.stringify([d.contacts.map(c => c.id + stamp(c)).sort(), Object.keys(d.deleted).sort()]);

  function setState(patch) {
    state = patch ? { ...(state || {}), ...patch } : null;
    writeJSON(STATE_KEY, state);
  }

  async function sync() {
    if (!state || !validToken()) { render(); return; }
    if (syncing) { again = true; return; }
    syncing = true;
    render('syncing');
    try {
      const fileId = await ensureFile();
      const remote = await download(fileId);
      const dirtyMark = localStorage.getItem(DIRTY_KEY);
      const merged = merge({ contacts, deleted: readJSON(DELETED_KEY, {}) }, remote);
      contacts = merged.contacts;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(contacts));
      writeJSON(DELETED_KEY, merged.deleted);
      renderContacts();
      if (dirtyMark || signature(merged) !== signature(remote)) await upload(fileId, merged);
      if (localStorage.getItem(DIRTY_KEY) === dirtyMark) localStorage.removeItem(DIRTY_KEY);
      setState({ lastSync: Date.now() });
      render('ok');
    } catch (e) {
      console.warn('Drive:', e);
      render(e.auth ? 'reconnect' : navigator.onLine ? 'error' : 'offline');
    } finally {
      syncing = false;
      if (again) { again = false; schedule(); }
    }
  }
  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(sync, 1200);
  }
  function markDirty() {
    localStorage.setItem(DIRTY_KEY, String(Date.now()));
    schedule();
  }

  function render(s) {
    if (!state) s = 'off';
    else if (!s) s = validToken() ? 'ok' : 'reconnect';
    const pending = !!localStorage.getItem(DIRTY_KEY);
    const email = state?.email || '';
    const msgs = {
      off:       ['Guardar en Google Drive', 'conectar'],
      syncing:   ['Guardando en Drive…', email],
      ok:        ['Guardado en Google Drive', email],
      reconnect: ['Drive en pausa', pending ? 'tocá para guardar' : 'tocá para reconectar'],
      offline:   ['Sin conexión', 'se guarda al volver'],
      error:     ['No se pudo guardar en Drive', 'tocá para reintentar'],
    };
    const bar = document.getElementById('driveBar');
    bar.dataset.state = s === 'offline' ? 'error' : s;
    [document.getElementById('driveText').textContent, document.getElementById('driveSub').textContent] = msgs[s];
  }

  function disconnect() {
    const t = validToken();
    if (t && window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(t, () => {});
    writeJSON(TOKEN_KEY, null);
    setState(null);
    render();
  }

  async function onBarClick() {
    if (!GOOGLE_CLIENT_ID) {
      alert('Falta configurar el ID de cliente de Google (GOOGLE_CLIENT_ID) en el código.');
      return;
    }
    const current = document.getElementById('driveBar').dataset.state;
    if (current === 'syncing') return;
    if (current === 'ok') {
      if (confirm('¿Desconectar Google Drive en este dispositivo?\nLos contactos siguen guardados en Drive y en este teléfono.')) disconnect();
      return;
    }
    try {
      if (!validToken()) await requestToken();
      if (!state?.email) {
        const about = await (await api('/about?fields=user(emailAddress)')).json();
        setState({ email: about.user.emailAddress });
      }
      await sync();
    } catch (e) {
      if (e.popup !== 'popup_closed') alert('No se pudo conectar con Google Drive: ' + e.message);
      render();
    }
  }

  function init() {
    document.getElementById('driveBar').addEventListener('click', onBarClick);
    render();
    if (state && validToken()) sync();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && state && validToken()) sync();
    });
    window.addEventListener('online', () => { if (state && validToken()) sync(); });
  }

  return { init, markDirty };
})();

// ===== INIT =====
renderContacts();
Drive.init();

// ===== APP ICON + MANIFEST (PWA en iPhone) =====
(function setupAppIcon() {
  function buildIcon(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');

    // Fondo crema
    ctx.fillStyle = '#ebe5d6';
    ctx.fillRect(0, 0, size, size);

    // Patrón saffiano (puntos)
    ctx.fillStyle = 'rgba(21,19,15,0.10)';
    const step = size / 14;
    for (let x = step / 2; x < size; x += step) {
      for (let y = step / 2; y < size; y += step) {
        ctx.beginPath();
        ctx.arc(x, y, size * 0.0055, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Línea superior
    ctx.strokeStyle = '#15130f';
    ctx.lineWidth = Math.max(1, size * 0.005);
    ctx.beginPath();
    ctx.moveTo(size * 0.18, size * 0.20);
    ctx.lineTo(size * 0.82, size * 0.20);
    ctx.stroke();

    // Triángulo sage (motivo Prada)
    ctx.strokeStyle = '#5b7d6a';
    ctx.lineWidth = Math.max(1.5, size * 0.014);
    ctx.beginPath();
    ctx.moveTo(size * 0.5, size * 0.235);
    ctx.lineTo(size * 0.555, size * 0.305);
    ctx.lineTo(size * 0.445, size * 0.305);
    ctx.closePath();
    ctx.stroke();

    // R serif italic monumental
    ctx.fillStyle = '#15130f';
    ctx.font = `italic 600 ${size * 0.55}px Georgia, "Times New Roman", serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('R', size * 0.5, size * 0.58);

    // RITA · GUERIN tracked
    ctx.fillStyle = '#15130f';
    ctx.font = `700 ${size * 0.058}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
    ctx.fillText('R I T A   ·   G U E R I N', size * 0.5, size * 0.86);

    // Línea inferior
    ctx.strokeStyle = '#15130f';
    ctx.lineWidth = Math.max(1, size * 0.005);
    ctx.beginPath();
    ctx.moveTo(size * 0.18, size * 0.92);
    ctx.lineTo(size * 0.82, size * 0.92);
    ctx.stroke();

    return c.toDataURL('image/png');
  }

  try {
    const icon180 = buildIcon(180);
    const icon192 = buildIcon(192);
    const icon512 = buildIcon(512);

    // Apple touch icon (Safari iOS lo lee al "Agregar a inicio")
    const apple = document.createElement('link');
    apple.rel = 'apple-touch-icon';
    apple.setAttribute('sizes', '180x180');
    apple.href = icon180;
    document.head.appendChild(apple);

    // Favicon genérico
    const fav = document.createElement('link');
    fav.rel = 'icon';
    fav.type = 'image/png';
    fav.href = icon192;
    document.head.appendChild(fav);

    // Manifest PWA (Android / Chrome)
    const manifest = {
      name: 'Rita Guerin · MisContactos',
      short_name: 'Rita Guerin',
      start_url: location.pathname.split('/').pop() || '.',
      scope: '.',
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#ebe5d6',
      theme_color: '#15130f',
      icons: [
        { src: icon192, sizes: '192x192', type: 'image/png' },
        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
      ]
    };
    const blobUrl = URL.createObjectURL(
      new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' })
    );
    const man = document.createElement('link');
    man.rel = 'manifest';
    man.href = blobUrl;
    document.head.appendChild(man);
  } catch (e) {
    console.warn('No se pudo generar el icono:', e);
  }
})();
</script>
